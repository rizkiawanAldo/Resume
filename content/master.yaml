# ── Slide 2: About ─────────────────────────────────────────────────────────
about:
  kicker: "02. Mindset & Journey"
  title: "From Physical Signals to Data Streams"
  signal_caption: "Seismic Wave Modeling → Real-Time Microservice Message Streams"
  paragraphs:
    - "I'm **Aldo Rizkiawan**. My engineering path began in **Geophysics Engineering at ITS Surabaya**, where I spent years analyzing wave propagation, modeling earth systems, and decoding signal noise under uncertainty."
    - "That background gave me a distinct edge in software: I treat large distributed backend architectures as complex physical systems where latency, signal loss, and concurrency race conditions must be carefully bounded."
    - "Over the past 7 years, I've built real-time fraud engines at **Tokopedia** (saving ~120M IDR/month), streamlined document automation at **EximBank**, and launched insurance & developer documentation platforms at **Grab**."
    - "When I'm not writing Golang or C#, I'm shooting 35mm film photography through [Xenosumedia](https://xenosumedia.com) and coding privacy-first browser utilities."
  metrics:
    - accent: "gold"
      value: "7+ Yrs"
      label: "Backend & Fullstack"
      desc: "Distributed microservices, concurrency & APIs"
    - accent: "cyan"
      value: "31,000"
      label: "Ride Cover Plus Txns"
      desc: "Onboarded in 2 weeks for Grab Philippines"
    - accent: "emerald"
      value: "120M IDR"
      label: "Monthly Fraud Savings"
      desc: "Real-time Golang/Redis/Neo4j risk engine @ Tokopedia"

