    logo_color: "#00B14F"
    badge_accent: "amber"
    bullets:
      - id: "grab_ride_cover"
        title: "Ride Cover Plus (PH Insurance)"
        text: "Led end-to-end launch of Ride Cover Plus in the Philippines, managing cross-team engineering (including mobile development and web view), execution, and external stakeholders (product managers, data analysts, third-party insurers); generated **~31,000 new transactions** within two weeks of launch."
        tags: ["fullstack", "mobile", "webview", "cross-functional", "payments", "insurance", "launch"]
      - id: "grab_tech_docs"
        title: "Company-wide Tech Documentation Site"
        text: "Architected Grab's centralized technical documentation platform using Hugo; designed migration strategies, custom pipelines (content validation, quality, deployment, indexing), and networking infrastructure, now serving **11,000+ pages** to ~900 daily active users with integrated MCP and AI search."
        tags: ["hugo", "architecture", "ci-cd", "infra", "ai-search", "mcp", "developer-platform"]
      - id: "grab_i18n_automation"
        title: "Content & Dev Sync Automation"
        text: "Built automation sync and standardized localized content translation keys across platform services, reducing friction between product/content teams and engineering."
        tags: ["automation", "localization", "developer-tools", "platform"]
      - id: "grab_idp_catalog"
        title: "Tech Service Entity Catalog"
        text: "Contributed to core internal developer platform services cataloging entity ownership, service costs, API schemas, tech docs, and inter-service dependencies."
        tags: ["microservices", "developer-portal", "service-catalog", "api-schema"]

  - company: "Tokopedia"
    role: "Software Engineer (Backend Engineer)"
    location: "Jakarta, Indonesia"
    start_date: "Sep 2021"
    end_date: "Apr 2024"
    current: false
    cli_alias: "tokopedia"
    logo_text: "T"
    logo_color: "#42B549"
    bullets:
      - id: "tokopedia_rule_engine"
        title: "Real-Time Fraud Detection Engine"
        text: "Architected and deployed a low-latency, real-time rule engine using Golang, Redis, PostgreSQL, NSQ, and Neo4j to evaluate incoming transactions and payments across 2M+ daily orders; saved users **~120M IDR monthly** through automated fraud mitigation."
        tags: ["golang", "redis", "postgresql", "nsq", "neo4j", "fraud-detection", "high-throughput", "distributed-systems"]
      - id: "tokopedia_ato_detection"
        title: "Account Takeover (ATO) Detection"
        text: "Built a real-time ATO detection system by analyzing suspicious behavioral patterns and high-risk session events, mitigating fraud attacks and safeguarding user accounts, saving around 2K USD of user funds."
        tags: ["golang", "security", "anti-fraud", "real-time", "analytics"]
      - id: "tokopedia_graph_service"
        title: "Graph-as-a-Service"
        text: "Managed and provisioned Graph-as-a-Service infrastructure with Neo4j and Golang for cross-team adoption."
        tags: ["neo4j", "golang", "graph-database", "infrastructure", "platform"]
      - id: "tokopedia_risk_dashboard"
        title: "Fraud Admin Console"
        text: "Built an internal risk analytics dashboard in ReactJS, allowing risk operations teams to evaluate rules and eliminate false positives, reducing manual investigation overhead by **90%**."
        tags: ["reactjs", "frontend", "internal-tools", "analytics", "dashboard"]
      - id: "tokopedia_incident_tracker"
        title: "Incident Reporting Service"
        text: "Engineered an incident tracking service with Golang and SMTP, aggregating MTTA, MTTR, and resolution metrics from PagerDuty and production databases to deliver executive-level weekly reliability reports."
        tags: ["golang", "pagerduty", "smtp", "metrics", "reliability", "devops"]

