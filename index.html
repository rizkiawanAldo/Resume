<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aldo Rizkiawan — Backend Architect &amp; Visual Creator</title>
  <meta name="description"
    content="Personal portfolio & résumé of Aldo Rizkiawan. Full-Stack & Backend Software Engineer at Grab, Tokopedia, EximBank. Geophysics graduate & founder of Xenosumedia." />
  <meta property="og:title" content="Aldo Rizkiawan — Backend Architect & Visual Creator" />
  <meta property="og:description"
    content="Distributed Systems, Fraud Risk Engines, Developer Platforms & Photography." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />

  <!-- Google Fonts: Space Grotesk & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body data-theme="light">

  <!-- ── Top Header Navigation ───────────────────────── -->
  <header id="deck-header">
    <div class="header-inner">
      <div class="brand">
        <a href="#intro" class="slide-link-logo" data-slide="0">
          <span class="brand-avatar" id="brand-avatar">AR</span>
          <div class="brand-titles">
            <span class="brand-name" id="brand-name">Aldo Rizkiawan</span>
            <span class="brand-tag" id="brand-tag">Geophysics → Systems</span>
          </div>
        </a>
      </div>

      <!-- Rendered from content/master.yaml → slides[] -->
      <nav class="deck-nav" id="deck-nav"></nav>

      <div class="header-tools">
        <button id="theme-toggle" aria-label="Toggle Theme" title="Toggle Dark/Light Mode"
          style="background:none; border:none; color:var(--text-main); cursor:pointer; padding:8px; display:flex; align-items:center;">
          <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <div class="slide-counter">
          <span id="current-slide">01</span> <span class="counter-sep">/</span> <span id="total-slides">07</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ── Main Presentation Slides Deck ──────────────────────
       Slides are generated at runtime from content/master.yaml.
       To change any text, add/edit a photo or a job: edit that file. -->
  <main id="deck-container">
    <div class="slides-track" id="slides-track"></div>

    <div id="load-error" class="load-error" hidden></div>

    <noscript>
      <div class="load-error">
        <strong>JavaScript is required.</strong>
        <span>This page renders its content from <code>content/master.yaml</code>.</span>
      </div>
    </noscript>
  </main>

  <!-- ── Bottom Dock Navigation ───────────────────────────── -->
  <footer id="deck-dock">
    <div class="dock-inner">
      <div class="dock-shortcut-hint">
        <span class="kbd">←</span> <span class="kbd">→</span> navigate slides &nbsp;·&nbsp;
      </div>

      <div class="dock-dots" id="dock-dots"></div>

      <div class="dock-controls">
        <button id="prev-slide-btn" class="control-btn" title="Previous Slide (←)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>
        <button id="next-slide-btn" class="control-btn" title="Next Slide (→)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- ── Photography Lightbox Modal with EXIF Details ──────── -->
  <div id="lightbox-modal" class="lightbox">
    <div class="lightbox-overlay" id="lightbox-overlay"></div>
    <div class="lightbox-dialog">
      <button class="lightbox-close" id="lightbox-close" title="Close (Esc)">×</button>
      <div class="lightbox-body">
        <img id="lightbox-img" src="" alt="Photo Preview" />
        <div class="lightbox-info">
          <div>
            <span id="lightbox-title" class="lightbox-title"></span>
            <div id="lightbox-exif" class="lightbox-exif-specs"></div>
          </div>
          <span id="lightbox-counter" class="lightbox-counter"></span>
        </div>
      </div>
      <button id="lightbox-prev" class="lightbox-nav prev" title="Previous Photo">‹</button>
      <button id="lightbox-next" class="lightbox-nav next" title="Next Photo">›</button>
    </div>
  </div>

  <!-- YAML parser (only external dependency), then renderer, then deck engine -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" defer></script>
  <script src="render.js?v=1" defer></script>
  <script src="script.js?v=3" defer></script>
</body>

</html>
